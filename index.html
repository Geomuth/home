<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGeo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand"><h1>TechGeo</h1></div>
            <ul class="nav-links" id="nav-links">
                <li><a href="#home" class="nav-link active">Home</a></li>
                <li><a href="#home" class="nav-link">services</a></li>
                <li><a href="https://port.techgeo.co.ke" target="_blank" class="nav-link">portfolio</a></li>
                <li><a href="#home" class="nav-link">about</a></li>
                <li><a href="#home" class="nav-link">blog</a></li>
                <li><a href="#home" class="nav-link">contacts</a></li>
                <li><a href="#" id="loginBtn" class="nav-link">login</a></li>
                <li class="search" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></li>
            </ul>
            <div class="hamburger" id="hamburger"><i class="fa-solid fa-bars"></i></div>
        </div>
    </nav>

    <section class="hero" id="home">
        <div class="container hero-content">
            <h2>Discover the Future of Technology</h2>
            <p>Empowering your digital journey with cutting-edge solutions and expert insights.</p>
            <button class="cta-button" onclick="document.getElementById('ai-chat').scrollIntoView({behavior: 'smooth'})">explore with our Assistant</button>

            <!-- Newsletter Subscription Form -->
            <div class="subscription-form" style="margin-top: 30px;">
                <h3>Stay Updated – Subscribe</h3>
                <form id="subscribeForm">
                    <input type="email" id="subscribeEmail" placeholder="Enter your email" required>
                    <button type="submit" class="cta-button">Subscribe</button>
                </form>
                <p id="subscribeMessage" style="margin-top: 10px; font-size: 0.95rem;"></p>
            </div>
        </div>
    </section>

    <div id="searchModal" class="popup-overlay">
        <div class="popup-content search-content">
            <span class="close-popup" id="closeSearch">×</span>
            <div class="search-wrap">
                <input type="text" placeholder="Search TechGeo..." class="search-input">
                <button class="cta-button">Search</button>
            </div>
        </div>
    </div>

    <div id="authModal" class="popup-overlay">
        <div class="popup-content">
            <span class="close-popup" id="closeAuth">×</span>
            <div class="auth-tabs">
                <button id="showLogin" class="tab-btn active">Login</button>
                <button id="showRegister" class="tab-btn">Register</button>
            </div>
            <form id="loginForm" class="auth-form">
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="cta-button">Sign In</button>
            </form>
            <form id="registerForm" class="auth-form" style="display:none;">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="password" placeholder="Create Password" required>
                <button type="submit" class="cta-button">Create Account</button>
            </form>
        </div>
    </div>

    <div class="message" id="message"><i class="fa-solid fa-message"></i></div>
    <div id="ai-chat" class="ai-chat-modal">
        <div class="chat-container">
            <div class="chat-header">
                <h3>✳️ TechGeo Assistant</h3>
                <button class="chat-close" id="chatClose">×</button>
            </div>
            <div id="chatBox" class="chat-box"></div>
            <div class="chat-input-container">
                <input type="text" id="userInput" class="chat-input" placeholder="Type your question...">
                <button id="sendBtn" class="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
